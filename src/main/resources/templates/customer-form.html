<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Registration form</title>

    <style>
        .error {color:red}
    </style>
</head>

<body>
<i>Fill out the form. (*) name required.</i>
<br><br>
<!--Where to submit the data -> @{/processForm}-->
<!--Model attribute name -> th:object="customer"-->
<!--Sending using HTTP post -> method="POST"-->
<form th:action="@{/processForm}" th:object="${customer}" method="POST">

    First name: <input type="text" th:field="*{firstName}" />

    <br><br>

    Last name (*): <input type="text" th:field="*{lastName}" />

    <!--    Adding error message ( if present )-->
    <span th:if="${#fields.hasErrors('lastName')}"
          th:errors="*{lastName}"
          class="error"></span>

    <br><br>

    Free Passes: <input type="text" th:field="*{freePasses}" />

    <!--    Adding error message ( if present )-->
    <span th:if="${#fields.hasErrors('freePasses')}"
          th:errors="*{freePasses}"
          class="error"></span>

    <br><br>

    <input type="submit" value="Submit" />
</form>
</body>
</html>
